<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска публикаций</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Доска публикаций</h1>
    <p>Лабораторная работа № 3 · Асинхронный JavaScript и REST API</p>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="posts-title">
      <div class="card-head">
        <h2 id="posts-title">Публикации</h2>
        <button id="load-btn" type="button" class="btn">Загрузить публикации</button>
      </div>
      <div id="posts" class="posts" aria-live="polite">
        <p class="placeholder">Публикации ещё не загружены.</p>
      </div>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Новая публикация</h2>
      <form id="post-form" novalidate>
        <div class="field">
          <label for="title">Заголовок</label>
          <input id="title" name="title" type="text" placeholder="Введите заголовок" autocomplete="off">
        </div>
        <div class="field">
          <label for="body">Текст</label>
          <textarea id="body" name="body" rows="5" placeholder="Введите текст публикации"></textarea>
        </div>
        <button id="submit-btn" type="submit" class="btn btn-primary">Создать публикацию</button>
      </form>
    </section>

    <section class="card" aria-labelledby="msg-title">
      <h2 id="msg-title">Сообщения</h2>
      <div id="message" class="message" role="status" aria-live="polite">Готово к работе.</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
